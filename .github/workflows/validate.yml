name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -c "import ast, pathlib; files = list(pathlib.Path('.').rglob('*.py')); [ast.parse(path.read_text(encoding='utf-8'), filename=str(path)) for path in files]; print(f'Validated {len(files)} Python files')"
      - name: Validate JSON syntax
        run: python -c "import json, pathlib; files = list(pathlib.Path('.').rglob('*.json')); [json.loads(path.read_text(encoding='utf-8')) for path in files]; print(f'Validated {len(files)} JSON files')"
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev
      - name: Check the desktop build
        run: cargo check --locked --manifest-path desktop/Cargo.toml
