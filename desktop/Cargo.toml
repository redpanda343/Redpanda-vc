[package]
name = "redpanda"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "custom-protocol", "x11"] }
tauri-plugin-dialog = "=2.7.1"

[profile.release]
strip = true
